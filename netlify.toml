[build]
  command = "npm run build"
  publish = "public"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # 'unsafe-inline' is required for style-src because Gatsby inlines its
    # critical CSS block, and for script-src because Gatsby emits inline
    # hydration + JSON-LD scripts. connect-src/form-action allow the pilot
    # modal to POST to formsubmit.co. img-src data: covers the aspect-ratio
    # spacer SVGs, https: covers OG/social images.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://js.hs-scripts.com https://js.hs-analytics.net https://js.hs-banner.com https://js.hscollectedforms.net https://js.usemessages.com https://js.hubspot.com; connect-src 'self' https://formsubmit.co https://*.hubspot.com https://*.hs-scripts.com https://*.hs-analytics.net https://*.hs-banner.com https://*.hscollectedforms.net https://*.hubapi.com https://track.hubspot.com https://forms.hsforms.com; form-action 'self' https://formsubmit.co https://forms.hsforms.com; frame-src https://*.hubspot.com https://app.hubspot.com; upgrade-insecure-requests"
