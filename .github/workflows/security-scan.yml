name: Security scan

# Pull requests: fail only on NEW secrets or NEW code issues the PR adds.
# Weekly (and on demand): scan the whole repo and report what is already there.
on:
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$tarball" gitleaks
      - name: Scan commits in this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .
      - name: Scan all current files
        if: github.event_name != 'pull_request'
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --verbose .

  code:
    name: Code scan (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install --quiet semgrep==1.186.0
      - name: Scan changes in this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan --config p/default --metrics=off --error \
            --exclude bower_components --exclude '*.min.js' --exclude '*.map' \
            --baseline-commit "$BASE_SHA"
      - name: Scan whole repo (report only)
        if: github.event_name != 'pull_request'
        run: |
          semgrep scan --config p/default --metrics=off \
            --exclude bower_components --exclude '*.min.js' --exclude '*.map' \
            --json-output=semgrep.json
          python3 -c "import json,collections;r=json.load(open('semgrep.json'))['results'];c=collections.Counter(x['extra']['severity'] for x in r);print(f'### Semgrep: {len(r)} findings', dict(c))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: semgrep-results
          path: semgrep.json
